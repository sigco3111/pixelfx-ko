<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>픽셀FX 한글판</title>
<meta name="description" content="코드로 그리는 픽셀 아트 효과와 애니메이션. 재생하고, 색을 바꾸고, 스프라이트 시트로 내보내세요.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Funnel+Sans:wght@400;500&family=Red+Hat+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!--BODY-->
<header class="head">
  <div class="title">
    <svg class="mark" viewBox="0 0 7 7" shape-rendering="crispEdges" role="img" aria-label="Patch"><rect x="1" y="1" width="6" height="6" fill="#ffffff"/><rect x="0" y="0" width="3" height="3" fill="#f53cd1"/></svg>
    <div>
      <h1>픽셀FX.</h1>
      <p class="sub">픽셀 아트 효과 <span id="count">0</span>가지, 모두 작은 코드 한 조각.</p>
    </div>
  </div>
  <nav class="links">
    <a href="https://github.com/sigco3111/pixelfx-ko" target="_blank" rel="noopener">github</a>
    <a href="https://github.com/patch-gg/pixelfx#the-skill" target="_blank" rel="noopener">원작 스킬</a>
    <a href="https://patch.gg" target="_blank" rel="noopener">patch.gg</a>
  </nav>
</header>
<div class="bar">
  <div class="bar-in">
    <div class="chips" id="chips" role="toolbar" aria-label="분류"></div>
    <input id="q" type="search" placeholder="검색" aria-label="효과 검색" autocomplete="off">
  </div>
</div>
<main id="grid"></main>
<p class="empty" id="none" hidden>맞는 결과가 없습니다. 불, 베기, 반복 같은 단어로 찾아 보세요.</p>
<dialog class="detail" id="detail" aria-labelledby="d-name">
  <div class="sheet">
    <div>
      <div class="big"><canvas id="big"></canvas><button class="close" id="d-close" type="button">닫기</button></div>
    </div>
    <div class="info">
      <h2 id="d-name"></h2>
      <div class="id" id="d-id"></div>
      <p id="d-desc"></p>
      <dl class="facts" id="d-facts"></dl>
      <div class="controls">
        <div class="row"><label>재생</label><button class="btn" id="d-play" type="button">일시정지</button><button class="btn" id="d-again" type="button">다시</button><span id="d-speed" class="row"></span></div>
        <div class="row"><label>배경</label><span id="d-bg" class="row"></span></div>
        <div class="row"><label>팔레트</label><select class="btn" id="d-pal" aria-label="팔레트"></select><button class="btn" id="d-seed" type="button">새 시드</button></div>
        <div class="row"><label>표시</label><button class="btn" id="d-flip" type="button">좌우 반전</button><button class="btn" id="d-actor" type="button">캐릭터</button><button class="btn" id="d-make" type="button">스프라이트 시트</button></div>
      </div>
      <div class="code-head"><span>사용법</span><span><a id="d-src" target="_blank" rel="noopener">소스</a> · <button class="btn" id="d-copy" type="button">복사</button></span></div>
      <pre id="d-code"></pre>
    </div>
    <div class="sheetout" id="d-sheet"></div>
  </div>
</dialog>
<!--/BODY-->
<script type="module" src="app.js"></script>
</body>
</html>
